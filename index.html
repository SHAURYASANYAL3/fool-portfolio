<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Shaurya Sanyal — World Builder. Architect of Digital Realms."/>
  <meta property="og:title" content="Shaurya Sanyal — Minecraft Portfolio"/>
  <title>Shaurya Sanyal — World Builder</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

  <style>
    /* ═══════════════════════════════════════
       TOKENS
    ═══════════════════════════════════════ */
    :root{
      /* Minecraft Palette */
      --void:      #0a0a0a;
      --deep-void: #050505;
      --mc-gui:    #c6c6c6;
      --mc-stone:  #7d7d7d;
      --mc-grass:  #4caf50;
      --mc-dirt:   #8b4513;
      --mc-diamond:#00ffff;
      --mc-purple: #a020f0;
      --mc-xp:      #80ff20;
      --mc-health:  #ff0040;
      
      /* UI Colors */
      --bg:        var(--void);
      --surface:   #1e1e1e;
      --text:      #ffffff;
      --text-dim:  #a0a0a0;
      --border:    #373737;
      --border-hi: #ffffff;
      
      /* Typography */
      --ff-pixel:  'VT323', monospace;
      --ff-body:   'Inter', sans-serif;
      --ff-mono:   'JetBrains Mono', monospace;
      
      --ease:      cubic-bezier(.25, .46, .45, .94);
      --ease-step: steps(4, end); /* for pixel animations */
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--mc-stone) transparent}
    ::-webkit-scrollbar{width:8px;image-rendering:pixelated}
    ::-webkit-scrollbar-track{background:var(--void)}
    ::-webkit-scrollbar-thumb{background:var(--mc-stone);border:2px solid var(--border)}
    
    body{
      background:var(--bg);color:var(--text);
      font-family:var(--ff-body);font-size:16px;line-height:1.6;
      overflow-x:hidden;image-rendering:pixelated;
      cursor:none; /* Hide default cursor */
    }
    a, button, .mc-border, .skill-slot{ cursor:none!important; }

    /* ═══════════════════════════════════════
       MINECRAFT UTILITIES
    ═══════════════════════════════════════ */
    .mc-border{
      position:relative;
      background:var(--mc-gui);
      border:4px solid #373737;
      box-shadow: 
        inset 4px 4px 0 #ffffff,
        inset -4px -4px 0 #8b8b8b;
      padding:1rem;
      color:#373737;
    }
    .mc-border-dark{
      background:var(--surface);
      border:4px solid #000;
      box-shadow: 
        inset 4px 4px 0 #373737,
        inset -4px -4px 0 #121212;
      padding:1.5rem;
    }
    .pixel-text{font-family:var(--ff-pixel);image-rendering:pixelated}
    
    /* ═══════════════════════════════════════
       FIXED LAYERS
    ═══════════════════════════════════════ */
    #world-bg{
      position:fixed;inset:0;z-index:0;pointer-events:none;
      background:linear-gradient(to bottom, #0a0a0f, #1a1a2e);
    }
    #vignette{
      position:fixed;inset:0;z-index:1;pointer-events:none;
      background:radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 100%);
    }
    #grain-layer{
      position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.04;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ═══════════════════════════════════════
       CURSOR (Pixel Crosshair)
    ═══════════════════════════════════════ */
    #cursor-pixel{
      position:fixed;width:24px;height:24px;z-index:9999;pointer-events:none;
      transform:translate(-50%,-50%);image-rendering:pixelated;
    }
    #cursor-pixel::before, #cursor-pixel::after{
      content:'';position:absolute;background:white;box-shadow:0 0 0 2px black;
    }
    #cursor-pixel::before{top:50%;left:0;width:100%;height:2px;transform:translateY(-50%)}
    #cursor-pixel::after{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
    @media(hover:none){#cursor-pixel{display:none}}

    /* ═══════════════════════════════════════
       KEYFRAMES
    ═══════════════════════════════════════ */
    @keyframes heroAppear{
      from{opacity:0;transform:translateY(20px)}
      to  {opacity:1;transform:translateY(0)}
    }
    @keyframes ringExpand{
      from{opacity:0;transform:translate(-50%,-50%) scale(.7)}
      to  {opacity:1;transform:translate(-50%,-50%) scale(1)}
    }
    @keyframes goldShimmer{
      0%  {background-position:0% 50%}
      100%{background-position:300% 50%}
    }
    @keyframes scrollPulse{
      0%,100%{opacity:.35;transform:scaleY(1)}
      50%    {opacity:.9; transform:scaleY(1.2)}
    }
    @keyframes dotThrob{
      0%,100%{box-shadow:0 0 5px currentColor}
      50%    {box-shadow:0 0 14px currentColor}
    }
    @keyframes rippleOut{
      0%  {transform:translate(-50%,-50%) scale(0);opacity:1}
      100%{transform:translate(-50%,-50%) scale(7);opacity:0}
    }
    @keyframes shimmerStreak{
      0%  {left:-100%}
      100%{left:200%}
    }

    /* hero entrance */
    .h-appear{opacity:0;animation:heroAppear .9s var(--ease2) forwards}

    /* ═══════════════════════════════════════
       LAYOUT
    ═══════════════════════════════════════ */
    .wrap{position:relative;z-index:3}
    .container{max-width:1080px;margin:0 auto;padding:0 2rem}

    /* ═══════════════════════════════════════
       NAV
    ═══════════════════════════════════════ */
    #main-nav{
      position:fixed;top:0;left:0;right:0;z-index:200;
      padding:1.4rem 2.5rem;
      display:flex;align-items:center;justify-content:space-between;
      transition:background .4s,backdrop-filter .4s,border-color .4s;
    }
    #main-nav.solid{
      background:rgba(8,8,15,.9);
      backdrop-filter:blur(28px) saturate(1.5);
      -webkit-backdrop-filter:blur(28px) saturate(1.5);
      border-bottom:1px solid var(--border);
    }
    .nav-logo{
      font-family:var(--ff-d);font-size:.88rem;letter-spacing:.24em;
      color:var(--gold);text-decoration:none;
      display:flex;align-items:center;gap:.5rem;
    }
    .nav-links{display:flex;gap:2.2rem;list-style:none}
    .nav-links a{
      font-family:var(--ff-u);font-size:.62rem;letter-spacing:.24em;
      text-transform:uppercase;color:var(--text2);text-decoration:none;
      position:relative;transition:color .3s;
    }
    .nav-links a::after{
      content:'';position:absolute;bottom:-3px;left:0;
      width:0;height:1px;background:var(--gold);transition:width .35s var(--ease);
    }
    .nav-links a:hover{color:var(--gold)}
    .nav-links a:hover::after{width:100%}
    /* Ham */
    .ham{display:none;background:none;border:none;cursor:none;
      flex-direction:column;gap:5px;padding:4px}
    .ham span{display:block;width:22px;height:1px;background:var(--text2);transition:.3s}
    .ham.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
    .ham.open span:nth-child(2){opacity:0}
    .ham.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
    .mob-drawer{
      display:none;position:fixed;top:0;right:0;bottom:0;width:260px;z-index:199;
      background:rgba(8,8,15,.97);backdrop-filter:blur(24px);
      border-left:1px solid var(--border);padding:6rem 2rem;
      transform:translateX(100%);transition:transform .42s var(--ease2);
    }
    .mob-drawer.open{transform:translateX(0)}
    .mob-drawer ul{list-style:none;display:flex;flex-direction:column;gap:2.2rem}
    .mob-drawer a{
      font-family:var(--ff-d);font-size:1.05rem;letter-spacing:.12em;
      color:var(--text2);text-decoration:none;transition:color .3s;
    }
    .mob-drawer a:hover{color:var(--gold)}
    @media(max-width:680px){
      .nav-links{display:none}
      .ham{display:flex}
      .mob-drawer{display:block}
    }

    /* ═══════════════════════════════════════
       HERO
    ═══════════════════════════════════════ */
    #hero{
      position:relative;min-height:100vh;overflow:hidden;
      display:flex;align-items:center;padding:8rem 2rem 6rem;
    }
    .hero-canvas{
      position:absolute;inset:0;width:100%;height:100%;
      display:block;z-index:1;
    }
    .hero-content{
      position:relative;z-index:2;
      max-width:1080px;margin:0 auto;width:100%;
    }
    .hero-grid{
      display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:2rem;
    }
    .hero-badge{
      display:inline-flex;align-items:center;gap:.6rem;
      font-family:var(--ff-u);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;
      color:var(--gold);border:1px solid var(--border2);
      padding:.46rem 1.1rem;border-radius:50px;margin-bottom:2rem;
      background:var(--gold-dim);backdrop-filter:blur(8px);
    }
    .badge-dot{
      width:5px;height:5px;border-radius:50%;
      background:var(--gold);box-shadow:0 0 7px var(--gold);
      animation:dotThrob 2s ease infinite;
    }
    .hero-h1{
      font-family:var(--ff-d);
      font-size:clamp(3.8rem,11vw,8.5rem);
      font-weight:600;letter-spacing:.04em;line-height:1;
      color:var(--text);margin-bottom:.3rem;
    }
    .gold-shimmer{
      background:linear-gradient(
        120deg,var(--gold) 0%,var(--gold2) 20%,
        #fff8e0 40%,var(--gold2) 60%,var(--gold) 80%,var(--gold2) 100%
      );
      background-size:300% 100%;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:goldShimmer 6s linear infinite;
    }
    .hero-name{
      font-family:var(--ff-b);font-size:clamp(.88rem,2vw,1.1rem);
      font-weight:400;letter-spacing:.35em;text-transform:uppercase;
      color:var(--text2);margin-bottom:2rem;
    }
    .hero-tagline{
      font-size:clamp(1rem,1.7vw,1.18rem);font-style:italic;font-weight:400;
      color:var(--text2);max-width:500px;line-height:1.9;margin-bottom:3rem;
    }
    .hero-cta{display:flex;gap:1.2rem;flex-wrap:wrap}
    .btn-gold{
      display:inline-flex;align-items:center;gap:.5rem;
      font-family:var(--ff-u);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
      text-decoration:none;padding:.9rem 2rem;border-radius:8px;
      background:var(--gold);color:#0b0b0f;font-weight:500;
      transition:all .35s var(--ease);position:relative;overflow:hidden;
    }
    .btn-gold::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
      transform:translateX(-100%);transition:transform .6s;
    }
    .btn-gold:hover::before{transform:translateX(100%)}
    .btn-gold:hover{background:var(--gold2);box-shadow:0 0 36px var(--gold-glow);transform:translateY(-2px)}
    .btn-outline{
      display:inline-flex;align-items:center;
      font-family:var(--ff-u);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
      text-decoration:none;padding:.9rem 2rem;border-radius:8px;
      background:transparent;color:var(--gold);border:1px solid var(--border2);
      transition:all .35s var(--ease);position:relative;overflow:hidden;
    }
    .btn-outline::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(90deg,transparent,rgba(212,175,55,.08),transparent);
      transform:translateX(-100%);transition:transform .6s;
    }
    .btn-outline:hover::before{transform:translateX(100%)}
    .btn-outline:hover{background:var(--gold-dim);box-shadow:0 0 24px var(--gold-glow2);transform:translateY(-2px);border-color:rgba(212,175,55,.55)}
    .scroll-hint{
      display:flex;flex-direction:column;align-items:center;gap:.5rem;
      margin-top:5rem;opacity:.4;
    }
    .scroll-line{width:1px;height:46px;background:linear-gradient(to bottom,var(--gold),transparent);animation:scrollPulse 2s ease infinite}
    .scroll-hint span{font-family:var(--ff-u);font-size:.55rem;letter-spacing:.35em;text-transform:uppercase;color:var(--gold)}
    @media(max-width:820px){
      .hero-grid{grid-template-columns:1fr}
      .hero-tagline{max-width:100%}
    }

    /* ═══════════════════════════════════════
       SECTION HEADER
    ═══════════════════════════════════════ */
    .sec-head{text-align:center;margin-bottom:4rem}
    .sec-eye{font-family:var(--ff-pixel);font-size:1.2rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mc-stone);margin-bottom:.5rem}
    .sec-title{
      font-family:var(--ff-pixel);font-size:clamp(2.5rem,6vw,4rem);
      font-weight:400;color:var(--text);line-height:1.1;
    }
    .sec-title em{font-style:normal;color:var(--mc-xp)}
    .sec-rule{width:80px;height:4px;margin:1rem auto 0;background:var(--mc-stone)}

    /* ═══════════════════════════════════════
       SCROLL REVEAL
    ═══════════════════════════════════════ */
    .reveal{opacity:0;transform:translateY(30px);transition:opacity 0.6s var(--ease), transform 0.6s var(--ease)}
    .reveal.visible{opacity:1;transform:translateY(0)}

    /* ═══════════════════════════════════════
       BUTTONS
    ═══════════════════════════════════════ */
    .btn-gold, .btn-outline{
      display:inline-flex;align-items:center;padding:0.8rem 1.5rem;
      text-decoration:none;transition:all 0.2s var(--ease-step);
      cursor:none;
    }
    .btn-gold:hover, .btn-outline:hover{
      transform:translateY(-2px);
      filter:brightness(1.2);
    }
    .btn-gold:active, .btn-outline:active{
      transform:translateY(0);
    }

    /* ═══════════════════════════════════════
       COMPONENTS
    ═══════════════════════════════════════ */
    .artifact-card{
      transition:transform 0.3s var(--ease), border-color 0.3s var(--ease);
    }
    .artifact-card:hover{
      border-color:var(--mc-xp)!important;
    }
    .skill-slot:hover{
      background:#aaa!important;
      border-color:var(--mc-diamond)!important;
      transform:scale(1.1);
      z-index:2;
    }

    /* ═══════════════════════════════════════
       NAV & MOBILE
    ═══════════════════════════════════════ */
    #main-nav{
      position:fixed;top:0;left:0;right:0;z-index:200;
      padding:1.5rem 2rem;
      display:flex;align-items:center;justify-content:space-between;
      transition:background 0.3s;
    }
    #main-nav.solid{
      background:rgba(10,10,10,0.9);
      backdrop-filter:blur(10px);
    }
    .nav-links{display:flex;gap:2rem;list-style:none}
    .nav-links a{
      color:var(--text-dim);text-decoration:none;transition:color 0.2s;
    }
    .nav-links a:hover{color:var(--mc-xp)}
    
    .ham{display:none;flex-direction:column;gap:4px;cursor:none}
    .ham span{display:block;width:20px;height:2px;background:white}
    
    .mob-drawer{
      position:fixed;inset:0;z-index:199;display:none;
      flex-direction:column;align-items:center;justify-content:center;
      transform:translateX(100%);transition:transform 0.4s var(--ease);
    }
    .mob-drawer.open{display:flex;transform:translateX(0)}
    .mob-drawer ul{list-style:none;text-align:center}
    .mob-drawer li{margin-bottom:2rem}

    @media(max-width:768px){
      .nav-links{display:none}
      .ham{display:flex}
      .hero-grid{grid-template-columns:1fr!important}
    }
  </style>
</head>
<body>

<!-- ── FIXED AMBIENT LAYERS ── -->
<canvas id="star-cvs"></canvas>
<div id="fog-layer"></div>
<div id="grain-layer"></div>
<div id="scroll-bar"></div>

<!-- ── CURSOR ── -->
<div id="cursor-pixel"></div>

<!-- ── REACT ROOT ── -->
<div id="root"></div>

<!-- ── CDN DEPS ── -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- ════════════════════════════════════════════════════════════
     REACT APPLICATION
════════════════════════════════════════════════════════════ -->
<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef } = React;

/* ─────────────────────────────────────────────
   STATIC DATA
───────────────────────────────────────────── */
const PROJECTS = [
  {
    id:'QUEST I', tbd:false, difficulty:'Hardcore',
    title:'E-Vara',
    tagline:'Digital Reputation Protector',
    desc:'A proactive digital identity monitoring platform. OSINT automation, reverse image intelligence, and 24/7 real-time alerts unified into one dashboard.',
    features:['Face-Based Verification','OSINT Monitoring','Breach Intelligence'],
    stack:['Node.js','Express.js','Vercel'],
    status:'Completed', statusColor:'var(--mc-xp)',
    github:'https://github.com/SHAURYASANYAL3/E-vara',
  },
  {
    id:'QUEST II', tbd:false, difficulty:'Survival',
    title:'Fatty Liver Risk Detector',
    tagline:'AI Health Awareness Oracle',
    desc:'ML tool estimating risk from clinical metrics. Random Forest model with SHAP explainability. Awareness first — never a substitute for clinical testing.',
    features:['SHAP Explainability','89% AUC-ROC','Streamlit UI'],
    stack:['Python','scikit-learn','Streamlit'],
    status:'Live', statusColor:'var(--mc-diamond)',
    github:'https://github.com/SHAURYASANYAL3/fatty-liver-risk-detector',
  },
  {
    id:'QUEST III', tbd:false, difficulty:'Adventure',
    title:'Cool Hand HUD',
    tagline:'AR-Style Hand Tracking HUD',
    desc:'Real-time hand tracking via MediaPipe. Overlays a sci-fi HUD with palm rings and particle trails on your webcam feed.',
    features:['Multi-Hand Tracking','WebGL Energy FX','Snapshot Capture'],
    stack:['JavaScript','MediaPipe','WebGL'],
    status:'Active', statusColor:'var(--mc-xp)',
    github:'https://github.com/SHAURYASANYAL3/hand-detection',
  },
];

const SKILLS = [
  { icon:'⚔️', name:'Python', level:'Master', lore:'The primary sword for AI and Automation.' },
  { icon:'🏹', name:'JavaScript', level:'Expert', lore:'Precision shots for interactive web interfaces.' },
  { icon:'🛡️', name:'Node.js', level:'Advanced', lore:'Robust infrastructure and defense systems.' },
  { icon:'🧪', name:'AI/ML', level:'Researcher', lore:'Synthesizing intelligence from raw data.' },
  { icon:'🧩', name:'OSINT', level:'Explorer', lore:'Solving the puzzles of the digital footprint.' },
  { icon:'💎', name:'SQL', level:'Miner', lore:'Extracting valuable data from deep structures.' },
  { icon:'🔥', name:'Infrastructure', level:'Builder', lore:'Forging the systems that host the world.' },
  { icon:'🗺️', name:'Product', level:'Strategist', lore:'Mapping the journey from idea to impact.' },
  { icon:'🖋️', name:'Writing', level:'Scholar', lore:'Documenting the lore of technical craft.' },
];

/* ─────────────────────────────────────────────
   THREE.JS SCENE — Rotating Voxel World
───────────────────────────────────────────── */
function ThreeScene() {
  const cvs = useRef(null);

  useEffect(() => {
    if (!cvs.current || !window.THREE) return;
    const T   = window.THREE;
    const el  = cvs.current;
    let W     = el.offsetWidth;
    let H     = el.offsetHeight;

    const scene    = new T.Scene();
    const camera   = new T.PerspectiveCamera(45, W / H, 0.1, 100);
    camera.position.set(0, 0, 8);

    const renderer = new T.WebGLRenderer({ canvas: el, antialias: false, alpha: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(1);
    renderer.setClearColor(0x000000, 0);

    const ambLight  = new T.AmbientLight(0xffffff, 0.8);
    const pointLight = new T.PointLight(0x00ffff, 3, 20);
    pointLight.position.set(-3, 3, 5);
    const dirLight  = new T.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 5, 5);
    scene.add(ambLight, pointLight, dirLight);

    const group = new T.Group();
    scene.add(group);

    // Main Grass Block
    const geometry = new T.BoxGeometry(2.2, 2.2, 2.2);
    const grassTop  = new T.MeshStandardMaterial({ color: 0x55aa33, roughness: 0.7 });
    const dirtSide  = new T.MeshStandardMaterial({ color: 0x7d4a2a, roughness: 0.9 }); // Darker brown
    const dirtBase  = new T.MeshStandardMaterial({ color: 0x4d2a1a, roughness: 1.0 });
    const materials = [dirtSide, dirtSide, grassTop, dirtBase, dirtSide, dirtSide];
    const block = new T.Mesh(geometry, materials);
    
    const edges = new T.EdgesGeometry(geometry);
    const line  = new T.LineSegments(edges, new T.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
    block.add(line);
    group.add(block);

    // Name Tag Floating Above
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 512; canvas.height = 128;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,512,128);
    ctx.font = 'bold 80px VT323';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText('SHAURYA', 256, 90);
    
    const tex = new T.CanvasTexture(canvas);
    const spriteMat = new T.SpriteMaterial({ map: tex });
    const sprite = new T.Sprite(spriteMat);
    sprite.scale.set(4, 1, 1);
    sprite.position.y = 2.5;
    group.add(sprite);

    // Floating Diamonds
    const diamonds = [];
    const diaGeom = new T.OctahedronGeometry(0.3, 0);
    const diaMat  = new T.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.8 });
    for(let i=0; i<3; i++){
      const dia = new T.Mesh(diaGeom, diaMat);
      const angle = (i / 3) * Math.PI * 2;
      dia.position.set(Math.cos(angle) * 4, Math.sin(angle) * 4, 0);
      group.add(dia);
      diamonds.push({ mesh: dia, angle });
    }

    // XP Particles
    const pN = 50;
    const pPos = new Float32Array(pN * 3);
    for (let i = 0; i < pN; i++) {
      pPos[i*3]   = (Math.random() - 0.5) * 12;
      pPos[i*3+1] = (Math.random() - 0.5) * 12;
      pPos[i*3+2] = (Math.random() - 0.5) * 12;
    }
    const pGeom = new T.BufferGeometry();
    pGeom.setAttribute('position', new T.BufferAttribute(pPos, 3));
    const pMat = new T.PointsMaterial({ color: 0x80ff20, size: 0.12, transparent: true, opacity: 0.7 });
    const pts  = new T.Points(pGeom, pMat);
    scene.add(pts);

    let raf, t = 0;
    const tick = () => {
      raf = requestAnimationFrame(tick);
      t  += 0.015;
      
      block.rotation.y += 0.008;
      block.rotation.x = Math.sin(t * 0.3) * 0.15;
      
      sprite.position.y = 2.5 + Math.sin(t * 2) * 0.1;

      diamonds.forEach((d, i) => {
        d.angle += 0.012;
        d.mesh.position.x = Math.cos(d.angle) * 4.2;
        d.mesh.position.z = Math.sin(d.angle) * 4.2;
        d.mesh.position.y = Math.sin(t + i) * 0.8;
        d.mesh.rotation.y += 0.03;
      });

      pts.rotation.y -= 0.002;
      renderer.render(scene, camera);
    };
    tick();

    const onResize = () => {
      W = el.offsetWidth; H = el.offsetHeight;
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      renderer.setSize(W, H);
    };
    window.addEventListener('resize', onResize);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      [geometry, diaGeom, pGeom].forEach(g => g.dispose());
      [...materials, diaMat, pMat, spriteMat].forEach(m => m.dispose());
      tex.dispose();
    };
  }, []);

  return <canvas ref={cvs} className="hero-canvas" />;
}

/* ─────────────────────────────────────────────
   CURSOR SYSTEM (Pixel Crosshair)
───────────────────────────────────────────── */
function CursorSystem() {
  useEffect(() => {
    if (window.matchMedia('(hover: none)').matches) return;
    const cur = document.getElementById('cursor-pixel');
    if (!cur) return;

    const onMove = e => {
      cur.style.left = e.clientX + 'px';
      cur.style.top  = e.clientY + 'px';
    };
    document.addEventListener('mousemove', onMove);

    const expand = () => { cur.style.transform = 'translate(-50%,-50%) scale(1.5)'; };
    const shrink = () => { cur.style.transform = 'translate(-50%,-50%) scale(1)'; };

    const bind = () => {
      document.querySelectorAll('a, button, .mc-border, .skill-slot').forEach(el => {
        el.addEventListener('mouseenter', expand);
        el.addEventListener('mouseleave', shrink);
      });
    };
    setTimeout(bind, 1000);

    return () => {
      document.removeEventListener('mousemove', onMove);
    };
  }, []);

  return null;
}

/* ─────────────────────────────────────────────
   APP ROOT
───────────────────────────────────────────── */
function App() {
  // Void Particle Background
  useEffect(() => {
    const cvs = document.getElementById('star-cvs');
    if (!cvs) return;
    const ctx = cvs.getContext('2d');
    let W, H, particles = [], raf;
    const resize = () => { W = cvs.width = innerWidth; H = cvs.height = innerHeight; };
    const mkParts = () => {
      particles = Array.from({ length: 150 }, () => ({
        x: Math.random()*W, y: Math.random()*H,
        sz: Math.random()*3 + 1,
        v: Math.random()*0.5 + 0.2,
        color: Math.random() > 0.8 ? '#a020f0' : '#444'
      }));
    };
    const draw = () => {
      raf = requestAnimationFrame(draw);
      ctx.clearRect(0,0,W,H);
      for(let p of particles) {
        p.y -= p.v;
        if(p.y < 0) p.y = H;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.sz, p.sz);
      }
    };
    resize(); mkParts(); draw();
    window.addEventListener('resize', () => { resize(); mkParts(); });
    return () => cancelAnimationFrame(raf);
  }, []);

  // Scroll reveal
  useEffect(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: .1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
  }, []);

  // Konami Code Easter Egg
  useEffect(() => {
    const code = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
    let idx = 0;
    const handler = (e) => {
      if(e.key === code[idx]) {
        idx++;
        if(idx === code.length) {
          alert('CHEATS ENABLED: Diamond Pickaxe Unlocked!');
          document.getElementById('cursor-pixel').innerHTML = '<span style="font-size:2rem; position:absolute; top:-20px; left:-20px;">⛏️</span>';
          idx = 0;
        }
      } else {
        idx = 0;
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  return (
    <div className="wrap">
      <CursorSystem />
      <Nav />
      <main>
        <Hero />
        <About />
        <Skills />
        <Projects />
        <Contact />
      </main>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
