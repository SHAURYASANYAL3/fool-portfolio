<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Shaurya Sanyal — The Fool. Architect of Digital Realms."/>
  <meta property="og:title" content="The Fool — Shaurya Sanyal"/>
  <title>The Fool — Shaurya Sanyal</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet"/>

  <style>
    /* ═══════════════════════════════════════
       TOKENS
    ═══════════════════════════════════════ */
    :root{
      --bg:        #0b0b0f;
      --bg2:       #0e0e16;
      --surface:   rgba(14,14,22,0.72);
      --text:      #ece9e0;
      --text2:     #9994a8;
      --text3:     #45424f;
      --gold:      #d4af37;
      --gold2:     #edc95c;
      --gold-dim:  rgba(212,175,55,.12);
      --gold-glow: rgba(212,175,55,.28);
      --gold-glow2:rgba(212,175,55,.07);
      --border:    rgba(212,175,55,.1);
      --border2:   rgba(212,175,55,.32);
      --ff-d:'Cinzel',serif;
      --ff-b:'EB Garamond',serif;
      --ff-u:'Outfit',sans-serif;
      --ease:cubic-bezier(.25,.46,.45,.94);
      --ease2:cubic-bezier(.16,1,.3,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--gold-dim) transparent}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px}
    body{
      background:var(--bg);color:var(--text);
      font-family:var(--ff-b);font-size:17px;line-height:1.75;
      overflow-x:hidden;cursor:none;
    }

    /* ═══════════════════════════════════════
       FIXED LAYERS
    ═══════════════════════════════════════ */
    #star-cvs{position:fixed;inset:0;z-index:0;pointer-events:none}
    #fog-layer{
      position:fixed;inset:0;z-index:1;pointer-events:none;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%,rgba(212,175,55,.04) 0%,transparent 60%),
        radial-gradient(ellipse 60% 40% at 85% 100%,rgba(40,40,120,.07) 0%,transparent 60%);
    }
    #grain-layer{
      position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.025;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    #scroll-bar{
      position:fixed;top:0;left:0;height:2px;width:0;z-index:300;
      background:linear-gradient(to right,transparent,var(--gold),var(--gold2));
      box-shadow:0 0 8px var(--gold-glow);transition:width .1s linear;
    }

    /* ═══════════════════════════════════════
       CURSOR
    ═══════════════════════════════════════ */
    #cur-dot{
      position:fixed;width:7px;height:7px;border-radius:50%;
      background:var(--gold2);z-index:9999;pointer-events:none;
      transform:translate(-50%,-50%);
      box-shadow:0 0 12px var(--gold-glow),0 0 24px var(--gold-glow2);
      mix-blend-mode:screen;transition:width .15s,height .15s;
    }
    #cur-ring{
      position:fixed;width:34px;height:34px;border-radius:50%;
      border:1px solid rgba(212,175,55,.42);z-index:9998;pointer-events:none;
      transform:translate(-50%,-50%);
      box-shadow:0 0 10px rgba(212,175,55,.1);
      transition:width .3s var(--ease2),height .3s var(--ease2),
                 border-color .3s,box-shadow .3s;
    }
    @media(hover:none){#cur-dot,#cur-ring{display:none}}

    /* ═══════════════════════════════════════
       KEYFRAMES
    ═══════════════════════════════════════ */
    @keyframes heroAppear{
      from{opacity:0;transform:translateY(20px)}
      to  {opacity:1;transform:translateY(0)}
    }
    @keyframes ringExpand{
      from{opacity:0;transform:translate(-50%,-50%) scale(.7)}
      to  {opacity:1;transform:translate(-50%,-50%) scale(1)}
    }
    @keyframes goldShimmer{
      0%  {background-position:0% 50%}
      100%{background-position:300% 50%}
    }
    @keyframes scrollPulse{
      0%,100%{opacity:.35;transform:scaleY(1)}
      50%    {opacity:.9; transform:scaleY(1.2)}
    }
    @keyframes dotThrob{
      0%,100%{box-shadow:0 0 5px currentColor}
      50%    {box-shadow:0 0 14px currentColor}
    }
    @keyframes rippleOut{
      0%  {transform:translate(-50%,-50%) scale(0);opacity:1}
      100%{transform:translate(-50%,-50%) scale(7);opacity:0}
    }
    @keyframes shimmerStreak{
      0%  {left:-100%}
      100%{left:200%}
    }

    /* hero entrance */
    .h-appear{opacity:0;animation:heroAppear .9s var(--ease2) forwards}

    /* ═══════════════════════════════════════
       LAYOUT
    ═══════════════════════════════════════ */
    .wrap{position:relative;z-index:3}
    .container{max-width:1080px;margin:0 auto;padding:0 2rem}

    /* ═══════════════════════════════════════
       NAV
    ═══════════════════════════════════════ */
    #main-nav{
      position:fixed;top:0;left:0;right:0;z-index:200;
      padding:1.4rem 2.5rem;
      display:flex;align-items:center;justify-content:space-between;
      transition:background .4s,backdrop-filter .4s,border-color .4s;
    }
    #main-nav.solid{
      background:rgba(8,8,15,.9);
      backdrop-filter:blur(28px) saturate(1.5);
      -webkit-backdrop-filter:blur(28px) saturate(1.5);
      border-bottom:1px solid var(--border);
    }
    .nav-logo{
      font-family:var(--ff-d);font-size:.88rem;letter-spacing:.24em;
      color:var(--gold);text-decoration:none;
      display:flex;align-items:center;gap:.5rem;
    }
    .nav-links{display:flex;gap:2.2rem;list-style:none}
    .nav-links a{
      font-family:var(--ff-u);font-size:.62rem;letter-spacing:.24em;
      text-transform:uppercase;color:var(--text2);text-decoration:none;
      position:relative;transition:color .3s;
    }
    .nav-links a::after{
      content:'';position:absolute;bottom:-3px;left:0;
      width:0;height:1px;background:var(--gold);transition:width .35s var(--ease);
    }
    .nav-links a:hover{color:var(--gold)}
    .nav-links a:hover::after{width:100%}
    /* Ham */
    .ham{display:none;background:none;border:none;cursor:none;
      flex-direction:column;gap:5px;padding:4px}
    .ham span{display:block;width:22px;height:1px;background:var(--text2);transition:.3s}
    .ham.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
    .ham.open span:nth-child(2){opacity:0}
    .ham.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
    .mob-drawer{
      display:none;position:fixed;top:0;right:0;bottom:0;width:260px;z-index:199;
      background:rgba(8,8,15,.97);backdrop-filter:blur(24px);
      border-left:1px solid var(--border);padding:6rem 2rem;
      transform:translateX(100%);transition:transform .42s var(--ease2);
    }
    .mob-drawer.open{transform:translateX(0)}
    .mob-drawer ul{list-style:none;display:flex;flex-direction:column;gap:2.2rem}
    .mob-drawer a{
      font-family:var(--ff-d);font-size:1.05rem;letter-spacing:.12em;
      color:var(--text2);text-decoration:none;transition:color .3s;
    }
    .mob-drawer a:hover{color:var(--gold)}
    @media(max-width:680px){
      .nav-links{display:none}
      .ham{display:flex}
      .mob-drawer{display:block}
    }

    /* ═══════════════════════════════════════
       HERO
    ═══════════════════════════════════════ */
    #hero{
      position:relative;min-height:100vh;overflow:hidden;
      display:flex;align-items:center;padding:8rem 2rem 6rem;
    }
    .hero-canvas{
      position:absolute;inset:0;width:100%;height:100%;
      display:block;z-index:1;
    }
    .hero-content{
      position:relative;z-index:2;
      max-width:1080px;margin:0 auto;width:100%;
    }
    .hero-grid{
      display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:2rem;
    }
    .hero-badge{
      display:inline-flex;align-items:center;gap:.6rem;
      font-family:var(--ff-u);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;
      color:var(--gold);border:1px solid var(--border2);
      padding:.46rem 1.1rem;border-radius:50px;margin-bottom:2rem;
      background:var(--gold-dim);backdrop-filter:blur(8px);
    }
    .badge-dot{
      width:5px;height:5px;border-radius:50%;
      background:var(--gold);box-shadow:0 0 7px var(--gold);
      animation:dotThrob 2s ease infinite;
    }
    .hero-h1{
      font-family:var(--ff-d);
      font-size:clamp(3.8rem,11vw,8.5rem);
      font-weight:600;letter-spacing:.04em;line-height:1;
      color:var(--text);margin-bottom:.3rem;
    }
    .gold-shimmer{
      background:linear-gradient(
        120deg,var(--gold) 0%,var(--gold2) 20%,
        #fff8e0 40%,var(--gold2) 60%,var(--gold) 80%,var(--gold2) 100%
      );
      background-size:300% 100%;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:goldShimmer 6s linear infinite;
    }
    .hero-name{
      font-family:var(--ff-b);font-size:clamp(.88rem,2vw,1.1rem);
      font-weight:400;letter-spacing:.35em;text-transform:uppercase;
      color:var(--text2);margin-bottom:2rem;
    }
    .hero-tagline{
      font-size:clamp(1rem,1.7vw,1.18rem);font-style:italic;font-weight:400;
      color:var(--text2);max-width:500px;line-height:1.9;margin-bottom:3rem;
    }
    .hero-cta{display:flex;gap:1.2rem;flex-wrap:wrap}
    .btn-gold{
      display:inline-flex;align-items:center;gap:.5rem;
      font-family:var(--ff-u);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
      text-decoration:none;padding:.9rem 2rem;border-radius:8px;
      background:var(--gold);color:#0b0b0f;font-weight:500;
      transition:all .35s var(--ease);position:relative;overflow:hidden;
    }
    .btn-gold::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
      transform:translateX(-100%);transition:transform .6s;
    }
    .btn-gold:hover::before{transform:translateX(100%)}
    .btn-gold:hover{background:var(--gold2);box-shadow:0 0 36px var(--gold-glow);transform:translateY(-2px)}
    .btn-outline{
      display:inline-flex;align-items:center;
      font-family:var(--ff-u);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
      text-decoration:none;padding:.9rem 2rem;border-radius:8px;
      background:transparent;color:var(--gold);border:1px solid var(--border2);
      transition:all .35s var(--ease);position:relative;overflow:hidden;
    }
    .btn-outline::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(90deg,transparent,rgba(212,175,55,.08),transparent);
      transform:translateX(-100%);transition:transform .6s;
    }
    .btn-outline:hover::before{transform:translateX(100%)}
    .btn-outline:hover{background:var(--gold-dim);box-shadow:0 0 24px var(--gold-glow2);transform:translateY(-2px);border-color:rgba(212,175,55,.55)}
    .scroll-hint{
      display:flex;flex-direction:column;align-items:center;gap:.5rem;
      margin-top:5rem;opacity:.4;
    }
    .scroll-line{width:1px;height:46px;background:linear-gradient(to bottom,var(--gold),transparent);animation:scrollPulse 2s ease infinite}
    .scroll-hint span{font-family:var(--ff-u);font-size:.55rem;letter-spacing:.35em;text-transform:uppercase;color:var(--gold)}
    @media(max-width:820px){
      .hero-grid{grid-template-columns:1fr}
      .hero-tagline{max-width:100%}
    }

    /* ═══════════════════════════════════════
       SECTION HEADER
    ═══════════════════════════════════════ */
    .sec-head{text-align:center;margin-bottom:5rem}
    .sec-eye{font-family:var(--ff-u);font-size:.58rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin-bottom:.9rem}
    .sec-title{
      font-family:var(--ff-d);font-size:clamp(1.8rem,4.5vw,3rem);
      font-weight:500;letter-spacing:.06em;color:var(--text);line-height:1.2;
    }
    .sec-title em{font-style:italic;color:var(--gold)}
    .sec-rule{width:56px;height:1px;margin:1.4rem auto 0;background:linear-gradient(to right,transparent,var(--gold),transparent)}

    /* ═══════════════════════════════════════
       SCROLL REVEAL
    ═══════════════════════════════════════ */
    .reveal{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease2),transform .8s var(--ease2)}
    .reveal.visible{opacity:1;transform:translateY(0)}
    .reveal-group>*{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease2),transform .7s var(--ease2)}
    .reveal-group.visible>*{opacity:1;transform:translateY(0)}

    /* ═══════════════════════════════════════
       ABOUT
    ═══════════════════════════════════════ */
    #about{padding:9rem 0}
    .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start}
    .about-body p{font-size:1.06rem;color:var(--text2);margin-bottom:1.6rem;line-height:1.9;font-weight:400}
    .about-body strong{color:var(--text);font-weight:500}
    .about-body p:last-child{margin-bottom:0}
    .about-quote{
      margin-top:2rem;padding:1.3rem 1.8rem;
      border-left:2px solid var(--gold);
      background:var(--gold-dim);border-radius:0 8px 8px 0;
    }
    .about-quote p{font-size:1.1rem!important;font-style:italic;color:var(--text)!important;margin:0!important}
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
    .stat-card{
      background:var(--surface);border:1px solid var(--border);border-radius:16px;
      padding:1.8rem 1.4rem;text-align:center;backdrop-filter:blur(12px);
      transition:transform .4s var(--ease),border-color .4s,box-shadow .4s;
    }
    .stat-num{font-family:var(--ff-d);font-size:2.6rem;font-weight:600;color:var(--gold);line-height:1;margin-bottom:.4rem}
    .stat-lbl{font-family:var(--ff-u);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text3)}
    @media(max-width:820px){.about-grid{grid-template-columns:1fr;gap:3.5rem}}

    /* ═══════════════════════════════════════
       ARTIFACT CARDS
    ═══════════════════════════════════════ */
    #projects{padding:9rem 0}
    .artifacts-list{display:grid;gap:2.2rem}
    .artifact-card{
      position:relative;overflow:hidden;
      background:var(--surface);border:1px solid var(--border);border-radius:24px;
      padding:2.8rem 3rem;backdrop-filter:blur(18px);
      transition:border-color .4s var(--ease),box-shadow .4s var(--ease);
      display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:start;
      transform-style:preserve-3d;
    }
    .artifact-card:hover{
      border-color:rgba(212,175,55,.28);
      box-shadow:0 28px 80px rgba(0,0,0,.65),0 0 50px rgba(212,175,55,.08);
    }
    .card-glow{
      position:absolute;inset:0;border-radius:24px;
      opacity:0;pointer-events:none;transition:opacity .4s;
    }
    .card-shimmer{
      position:absolute;top:0;left:-100%;width:55%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(212,175,55,.04),transparent);
      transform:skewX(-18deg);pointer-events:none;
    }
    .artifact-card:hover .card-shimmer{animation:shimmerStreak .9s var(--ease) forwards}
    .card-tbd{opacity:.45}
    .art-num{
      font-family:var(--ff-u);font-size:.57rem;letter-spacing:.35em;
      text-transform:uppercase;color:var(--gold);margin-bottom:.9rem;
      display:flex;align-items:center;gap:.6rem;
    }
    .art-num-line{width:22px;height:1px;background:var(--gold);opacity:.5}
    .art-title{
      font-family:var(--ff-d);font-size:clamp(1.3rem,2.8vw,1.85rem);
      font-weight:500;letter-spacing:.05em;color:var(--text);
      margin-bottom:.5rem;line-height:1.2;
    }
    .art-tagline{font-size:1rem;font-style:italic;color:var(--gold);margin-bottom:1.2rem;font-weight:400}
    .art-desc{font-size:.97rem;color:var(--text2);font-weight:400;line-height:1.85;max-width:660px}
    .art-feats{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));
      gap:.5rem;margin-top:1.6rem;
    }
    .art-feat{font-family:var(--ff-u);font-size:.64rem;color:var(--text2);display:flex;align-items:center;gap:.5rem;padding:.28rem 0}
    .feat-dot{font-size:.35rem;color:var(--gold);flex-shrink:0}
    .art-stack{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.6rem}
    .stk-tag{
      font-family:var(--ff-u);font-size:.6rem;letter-spacing:.1em;
      padding:.32rem .8rem;border-radius:50px;
      background:rgba(212,175,55,.05);border:1px solid var(--border);color:var(--text3);
    }
    .card-aside{display:flex;flex-direction:column;gap:.9rem;align-items:flex-end;min-width:120px}
    .art-status{
      display:inline-flex;align-items:center;gap:.4rem;
      font-family:var(--ff-u);font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text2);
    }
    .status-dot{width:5px;height:5px;border-radius:50%;animation:dotThrob 2s ease infinite}
    .art-link{
      font-family:var(--ff-u);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
      color:var(--gold);text-decoration:none;
      display:inline-flex;align-items:center;gap:.4rem;
      padding:.42rem .95rem;border:1px solid var(--border2);border-radius:50px;
      transition:all .3s var(--ease);
    }
    .art-link:hover{background:var(--gold-dim);border-color:rgba(212,175,55,.55);box-shadow:0 0 16px var(--gold-glow2)}
    @media(max-width:820px){
      .artifact-card{grid-template-columns:1fr;padding:2rem 1.8rem}
      .card-aside{flex-direction:row;align-items:center;justify-content:flex-start}
    }
    @media(max-width:480px){.artifact-card{padding:1.8rem 1.4rem}}

    /* ═══════════════════════════════════════
       SKILLS
    ═══════════════════════════════════════ */
    #skills{
      padding:9rem 0;
      background:linear-gradient(to bottom,transparent,rgba(12,12,20,.7) 20%,rgba(12,12,20,.7) 80%,transparent);
    }
    .skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8rem}
    .skill-card{
      background:var(--surface);border:1px solid var(--border);border-radius:16px;
      padding:2.2rem 1.8rem;backdrop-filter:blur(14px);
      transition:transform .4s var(--ease),border-color .4s,box-shadow .4s;
      position:relative;overflow:hidden;
    }
    .skill-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:1px;
      background:linear-gradient(to right,transparent,var(--gold),transparent);
      transform:scaleX(0);transition:transform .5s var(--ease);
    }
    .skill-card:hover::before{transform:scaleX(1)}
    .sk-icon{font-size:1.65rem;margin-bottom:1.1rem;display:block}
    .sk-title{font-family:var(--ff-d);font-size:.78rem;letter-spacing:.18em;color:var(--gold);font-weight:500;margin-bottom:1.3rem}
    .sk-tags{display:flex;flex-wrap:wrap;gap:.55rem}
    .sk-tag{
      font-family:var(--ff-u);font-size:.6rem;letter-spacing:.1em;
      padding:.36rem .84rem;border-radius:50px;
      background:rgba(212,175,55,.06);border:1px solid var(--border);color:var(--text2);
      transition:all .3s;cursor:default;
    }
    @media(max-width:900px){.skills-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:580px){.skills-grid{grid-template-columns:1fr}}

    /* ═══════════════════════════════════════
       CONTACT
    ═══════════════════════════════════════ */
    #contact{
      padding:9rem 0 7rem;
      background:linear-gradient(to bottom,transparent,rgba(10,10,16,.85));
    }
    .contact-box{max-width:680px;margin:0 auto;text-align:center}
    .contact-verse{font-size:1.18rem;font-style:italic;color:var(--text2);line-height:1.9;margin-bottom:.8rem}
    .contact-sub{font-family:var(--ff-u);font-size:.68rem;letter-spacing:.14em;color:var(--text3);margin-bottom:3.5rem}
    .contact-links{display:flex;gap:1.4rem;justify-content:center;flex-wrap:wrap}
    .c-link{
      display:flex;align-items:center;gap:.85rem;text-decoration:none;
      padding:1rem 1.7rem;background:var(--surface);border:1px solid var(--border);
      border-radius:16px;backdrop-filter:blur(12px);
      transition:all .35s var(--ease);color:var(--text2);
    }
    .c-link:hover{border-color:var(--border2);color:var(--gold);box-shadow:0 0 28px var(--gold-glow2);transform:translateY(-4px)}
    .c-link svg{fill:currentColor;flex-shrink:0}
    .c-link span{font-family:var(--ff-u);font-size:.65rem;letter-spacing:.18em;text-transform:uppercase}

    /* ═══════════════════════════════════════

/* ─────────────────────────────────────────────
   THREE.JS SCENE — Cosmic Orb
───────────────────────────────────────────── */
function ThreeScene() {
  const cvs = useRef(null);

  useEffect(() => {
    if (!cvs.current || !window.THREE) return;
    const T   = window.THREE;
    const el  = cvs.current;
    let W     = el.offsetWidth;
    let H     = el.offsetHeight;

    // ── Core setup ──────────────────────────
    const scene    = new T.Scene();
    const camera   = new T.PerspectiveCamera(52, W / H, 0.1, 50);
    camera.position.set(-0.4, 0, 5.5);

    const renderer = new T.WebGLRenderer({ canvas: el, antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);

    // ── Lights ──────────────────────────────
    const ambLight  = new T.AmbientLight(0x080c1a, 1.0);
    const goldLight = new T.PointLight(0xd4a030, 7.5, 12);
    goldLight.position.set(3, 2, 2);
    const blueLight = new T.PointLight(0x1828b0, 2.5, 14);
    blueLight.position.set(-3.5, -1.5, 1.5);
    const rimLight  = new T.PointLight(0xd4af37, 2.0, 8);
    rimLight.position.set(0, -3, -2);
    scene.add(ambLight, goldLight, blueLight, rimLight);

    // Orb centre
    const OX = 1.3;

    // ── Main orb ────────────────────────────
    const orbGeom = new T.SphereGeometry(1.1, 128, 128);
    const orbMat  = new T.MeshPhongMaterial({
      color:    new T.Color(0.045, 0.030, 0.014),
      emissive: new T.Color(0.62,  0.40,  0.08),
      emissiveIntensity: 0.38,
      specular: new T.Color(0.9, 0.72, 0.28),
      shininess: 145,
    });
    const orb = new T.Mesh(orbGeom, orbMat);
    orb.position.x = OX;
    scene.add(orb);

    // ── Inner hot core ───────────────────────
    const coreGeom = new T.SphereGeometry(0.52, 32, 32);
    const coreMat  = new T.MeshBasicMaterial({ color: 0xffd060, transparent: true, opacity: 0.76, blending: T.AdditiveBlending, depthWrite: false });
    const innerCore = new T.Mesh(coreGeom, coreMat);
    innerCore.position.x = OX;
    scene.add(innerCore);

    // ── Glow shells ──────────────────────────
    [[1.28, 0.065], [1.55, 0.042], [1.92, 0.025], [2.5, 0.012]].forEach(([s, op]) => {
      const m = new T.Mesh(
        new T.SphereGeometry(s, 24, 24),
        new T.MeshBasicMaterial({ color: 0xd4a030, transparent: true, opacity: op, side: T.BackSide, blending: T.AdditiveBlending, depthWrite: false })
      );
      m.position.x = OX;
      scene.add(m);
    });

    // ── Particle cloud ───────────────────────
    const pN = 2800;
    const pPos = new Float32Array(pN * 3);
    for (let i = 0; i < pN; i++) {
      const phi   = Math.random() * Math.PI * 2;
      const theta = Math.acos(2 * Math.random() - 1);
      const r     = 1.65 + Math.pow(Math.random(), 0.4) * 2.45;
      pPos[i*3]   = r * Math.sin(theta) * Math.cos(phi);
      pPos[i*3+1] = r * Math.sin(theta) * Math.sin(phi);
      pPos[i*3+2] = r * Math.cos(theta);
    }
    const pGeom = new T.BufferGeometry();
    pGeom.setAttribute('position', new T.BufferAttribute(pPos, 3));
    const pMat = new T.PointsMaterial({ color: 0xd4af37, size: 0.016, transparent: true, opacity: 0.52, blending: T.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
    const pts  = new T.Points(pGeom, pMat);
    pts.position.x = OX;
    scene.add(pts);

    // ── Energy rings ─────────────────────────
    const ringCfg = [
      { r: 1.72, t: 0.007, rx: Math.PI/2, ry: 0,   rz: 0,    op: 0.28, spd:  0.0017 },
      { r: 2.15, t: 0.005, rx: 0.38,      ry: 0,   rz: 0.65,  op: 0.18, spd: -0.0013 },
      { r: 2.65, t: 0.003, rx: 0.9,       ry: 0.3, rz: 0,     op: 0.12, spd:  0.001  },
    ];
    const rings = ringCfg.map(c => {
      const mesh = new T.Mesh(
        new T.TorusGeometry(c.r, c.t, 8, 200),
        new T.MeshBasicMaterial({ color: 0xd4af37, transparent: true, opacity: c.op, blending: T.AdditiveBlending, depthWrite: false })
      );
      mesh.position.x = OX;
      mesh.rotation.set(c.rx, c.ry, c.rz);
      scene.add(mesh);
      return { mesh, cfg: c };
    });

    // ── Mouse / resize ───────────────────────
    let mX = 0, mY = 0;
    const onMM = e => { mX = (e.clientX / innerWidth - 0.5) * 2; mY = (e.clientY / innerHeight - 0.5) * 2; };
    window.addEventListener('mousemove', onMM);

    const onResize = () => {
      W = el.offsetWidth; H = el.offsetHeight;
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      renderer.setSize(W, H);
    };
    window.addEventListener('resize', onResize);

    // ── Animation ────────────────────────────
    let raf, t = 0, camX = -0.4, camY = 0;

    const tick = () => {
      raf = requestAnimationFrame(tick);
      t  += 0.007;

      // Breathe
      const br = 1 + Math.sin(t * 0.72) * 0.028;
      orb.scale.setScalar(br);
      innerCore.scale.setScalar(br * (1 + Math.sin(t * 1.35) * 0.055));

      // Rotate
      orb.rotation.y += 0.0022;
      orb.rotation.x  = Math.sin(t * 0.28) * 0.08;
      pts.rotation.y += 0.0012;
      pts.rotation.x += 0.00038;

      // Ring pulses
      rings.forEach(({ mesh, cfg }, i) => {
        mesh.rotation.z += cfg.spd;
        mesh.material.opacity = cfg.op * (0.65 + 0.35 * Math.sin(t * [1.1, 0.78, 1.45][i]));
      });

      // Light pulse
      goldLight.intensity = 6.5 + Math.sin(t * 1.05) * 1.8;
      rimLight.intensity  = 1.8 + Math.sin(t * 0.6 + 1) * 0.85;

      // Smooth camera drift
      camX += (mX * 0.75 - 0.4 - camX) * 0.018;
      camY += (-mY * 0.45 - camY)       * 0.018;
      camera.position.x = camX;
      camera.position.y = camY;
      camera.lookAt(OX, 0, 0);

      renderer.render(scene, camera);
    };
    tick();

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', onMM);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      [orbGeom, orbMat, coreGeom, coreMat, pGeom, pMat].forEach(x => x.dispose());
    };
  }, []);

  return <canvas ref={cvs} className="hero-canvas" />;
}

/* ─────────────────────────────────────────────
   CURSOR SYSTEM
───────────────────────────────────────────── */
function CursorSystem() {
  useEffect(() => {
    if (window.matchMedia('(hover: none)').matches) return;

    const dot  = document.getElementById('cur-dot');
    const ring = document.getElementById('cur-ring');
    if (!dot || !ring) return;

    // Trail elements
    const TRAIL_N = 16;
    const trailEls = Array.from({ length: TRAIL_N }, (_, i) => {
      const el  = document.createElement('div');
      const sz  = Math.max(1.5, 6.5 - i * 0.3);
      const opa = Math.max(0.04, 0.58 - i * 0.034);
      el.style.cssText = `
        position:fixed;border-radius:50%;pointer-events:none;z-index:9996;
        transform:translate(-50%,-50%);
        width:${sz}px;height:${sz}px;
        background:rgba(212,175,55,${opa});
        filter:blur(${i < 5 ? 0 : 0.8}px);
        box-shadow:0 0 ${Math.max(0, 5 - i)}px rgba(212,175,55,${opa * 0.55});
      `;
      document.body.appendChild(el);
      return { el, x: -300, y: -300 };
    });

    let mx = -300, my = -300, rx = -300, ry = -300;
    const lp = (a, b, t) => a + (b - a) * t;

    const onMove = e => {
      mx = e.clientX; my = e.clientY;
      dot.style.left = mx + 'px';
      dot.style.top  = my + 'px';
    };
    document.addEventListener('mousemove', onMove);

    let rafId;
    const loop = () => {
      rafId = requestAnimationFrame(loop);
      rx = lp(rx, mx, 0.115);
      ry = lp(ry, my, 0.115);
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';

      trailEls[0].x = lp(trailEls[0].x, mx, 0.30);
      trailEls[0].y = lp(trailEls[0].y, my, 0.30);
      for (let i = 1; i < TRAIL_N; i++) {
        const sp = Math.max(0.075, 0.38 - i * 0.018);
        trailEls[i].x = lp(trailEls[i].x, trailEls[i-1].x, sp);
        trailEls[i].y = lp(trailEls[i].y, trailEls[i-1].y, sp);
      }
      trailEls.forEach(t => { t.el.style.left = t.x + 'px'; t.el.style.top = t.y + 'px'; });
    };
    loop();

    // Expand ring on interactables
    const expand = () => {
      ring.style.width = '52px'; ring.style.height = '52px';
      ring.style.borderColor = 'rgba(212,175,55,.75)';
      ring.style.boxShadow   = '0 0 22px rgba(212,175,55,.22)';
    };
    const shrink = () => {
      ring.style.width = '34px'; ring.style.height = '34px';
      ring.style.borderColor = 'rgba(212,175,55,.42)';
      ring.style.boxShadow   = '0 0 10px rgba(212,175,55,.1)';
    };
    const bindExpand = () => {
      document.querySelectorAll('a,button,.tilt-card,.skill-card,.stat-card,.c-link,.art-link,.btn-gold,.btn-outline').forEach(el => {
        el.addEventListener('mouseenter', expand);
        el.addEventListener('mouseleave', shrink);
      });
    };
    // Re-bind after React renders (slight delay)
    setTimeout(bindExpand, 600);

    // Magnetic buttons
    const bindMagnetic = () => {
      document.querySelectorAll('.magnetic').forEach(el => {
        el.addEventListener('mousemove', e => {
          const r  = el.getBoundingClientRect();
          const dx = (e.clientX - r.left - r.width  / 2) / (r.width  / 2);
          const dy = (e.clientY - r.top  - r.height / 2) / (r.height / 2);
          el.style.transform  = `translate(${dx * 11}px, ${dy * 7}px)`;
          el.style.transition = 'transform .08s linear';
        });
        el.addEventListener('mouseleave', () => {
          el.style.transform  = '';
          el.style.transition = 'transform .55s cubic-bezier(.16,1,.3,1)';
        });
      });
    };
    setTimeout(bindMagnetic, 600);

    // Click ripple
    const onCLick = e => {
      const rpl = document.createElement('div');
      rpl.style.cssText = `
        position:fixed;left:${e.clientX}px;top:${e.clientY}px;
        width:12px;height:12px;border-radius:50%;pointer-events:none;
        border:1px solid rgba(212,175,55,.72);
        transform:translate(-50%,-50%) scale(0);
        animation:rippleOut .65s ease-out forwards;
        z-index:9995;
      `;
      document.body.appendChild(rpl);
      setTimeout(() => rpl.remove(), 750);
    };
    document.addEventListener('click', onCLick);

    return () => {
      cancelAnimationFrame(rafId);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('click', onCLick);
      trailEls.forEach(t => t.el.remove());
    };
  }, []);

  return null;
}

function ArtifactCard({ p }) {
  const ref = useRef(null);

  const onMove = e => {
    const el = ref.current; if (!el) return;
    const r  = el.getBoundingClientRect();
    const dx = (e.clientX - r.left - r.width  / 2) / (r.width  / 2);
    const dy = (e.clientY - r.top  - r.height / 2) / (r.height / 2);
    el.style.transform  = `perspective(1000px) rotateX(${-dy * 6}deg) rotateY(${dx * 6}deg) scale3d(1.018,1.018,1.018)`;
    el.style.transition = 'transform .06s linear';
    const glow = el.querySelector('.card-glow');
    if (glow) {
      glow.style.background = `radial-gradient(circle at ${50 + dx*28}% ${50 + dy*28}%, rgba(212,175,55,.2) 0%, transparent 55%)`;
      glow.style.opacity = '1';
    }
  };

  const onLeave = () => {
    const el = ref.current; if (!el) return;
    el.style.transform  = '';
    el.style.transition = 'transform .55s cubic-bezier(.16,1,.3,1)';
    const glow = el.querySelector('.card-glow');
    if (glow) glow.style.opacity = '0';
  };

  return (
    <div ref={ref} className={`artifact-card tilt-card reveal ${p.tbd ? 'card-tbd' : ''}`}
      onMouseMove={onMove} onMouseLeave={onLeave}
    >

        <p className="art-desc">{p.desc}</p>

          <div className="art-feats">
            {p.features.map(f => <div key={f} className="art-feat"><span className="feat-dot">◆</span>{f}</div>)}

          <div className="art-stack">
            {p.stack.map(s => <span key={s} className="stk-tag">{s}</span>)}
          </div>
        )}
      </div>

      <div className="card-aside">
        <span className="art-status">
          <span className="status-dot" style={{background:p.statusColor, boxShadow:`0 0 7px ${p.statusColor}`}}></span>
          {p.status}
        </span>
        {p.demo   && <a href={p.demo}   target="_blank" rel="noopener" className="art-link magnetic">↗ Demo</a>}
        {p.github && <a href={p.github} target="_blank" rel="noopener" className="art-link magnetic">↗ GitHub</a>}
        {!p.github && !p.demo && <span style={{fontFamily:'var(--ff-u)',fontSize:'.58rem',letterSpacing:'.2em',textTransform:'uppercase',color:'var(--text3)'}}>Soon™</span>}

    </div>
  );
}

/* ─────────────────────────────────────────────
   APP ROOT
───────────────────────────────────────────── */
function App() {
  // Starfield
  useEffect(() => {
    const cvs = document.getElementById('star-cvs');
    if (!cvs) return;
    const ctx = cvs.getContext('2d');
    let W, H, stars = [], raf;
    const resize = () => { W = cvs.width = innerWidth; H = cvs.height = innerHeight; };
    const mkStars = () => {
      stars = Array.from({ length: 240 }, () => ({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*.95+.1,
        vx: (Math.random()-.5)*.038, vy: (Math.random()-.5)*.038,
        phase: Math.random()*Math.PI*2,
        freq: .0005+Math.random()*.001,
        layer: Math.floor(Math.random()*3),
      }));
    };
    let t = 0;
    const draw = () => {
      raf = requestAnimationFrame(draw);
      ctx.clearRect(0, 0, W, H);
      t += .007;
      for (const s of stars) {
        s.x += s.vx; s.y += s.vy;
        if (s.x < 0) s.x = W; if (s.x > W) s.x = 0;
        if (s.y < 0) s.y = H; if (s.y > H) s.y = 0;
        const a  = .1 + .5 * Math.abs(Math.sin(t * 50 * s.freq + s.phase));
        const sz = s.r * (s.layer===2 ? 1.5 : s.layer===1 ? 1.1 : 1);
        ctx.beginPath();
        ctx.arc(s.x, s.y, sz, 0, Math.PI*2);
        ctx.fillStyle = `hsla(42,55%,82%,${a*(s.layer===2?.78:.42)})`;
        ctx.fill();
      }
    };
    resize(); mkStars(); draw();
    window.addEventListener('resize', () => { resize(); mkStars(); });
    return () => cancelAnimationFrame(raf);
  }, []);

  // Scroll progress bar
  useEffect(() => {
    const bar = document.getElementById('scroll-bar');
    if (!bar) return;
    const fn = () => {
      const pct = scrollY / (document.documentElement.scrollHeight - innerHeight) * 100;
      bar.style.width = pct + '%';
    };
    addEventListener('scroll', fn);
    return () => removeEventListener('scroll', fn);
  }, []);

  // Scroll reveal with stagger
  useEffect(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.classList.add('visible');
        if (e.target.classList.contains('reveal-group')) {
          Array.from(e.target.children).forEach((child, i) => {
            child.style.transitionDelay = `${i * 0.1}s`;
            child.classList.add('visible');
          });
        }
        obs.unobserve(e.target);
      });
    }, { threshold: .1, rootMargin: '0px 0px -40px 0px' });

    const timer = setTimeout(() => {
      document.querySelectorAll('.reveal, .reveal-group').forEach(el => obs.observe(el));
    }, 400);
    return () => clearTimeout(timer);
  }, []);

  // Ham button show on mobile
  useEffect(() => {
    const btn = document.getElementById('ham-btn');
    const check = () => { if (btn) btn.style.display = innerWidth <= 680 ? 'flex' : 'none'; };
    check();
    addEventListener('resize', check);
    return () => removeEventListener('resize', check);
  }, []);

  return (
    <div className="wrap">
      <CursorSystem />
      <Nav />
      <main>
        <Hero />
        <About />
        <Projects />
        <Skills />
        <Contact />
      </main>
      <Footer />
    </div>
  );
}
